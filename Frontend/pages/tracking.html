<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi lô hàng | Cold Chain</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/tables.css">
    <style>
        .tracking-content{max-width:1500px;margin:0 auto;padding:28px}
        .tracking-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
        .tracking-header h1{margin:0 0 7px;color:#0f172a;font-size:26px}
        .tracking-header p{margin:0;color:#64748b}
        .tracking-summary{display:flex;align-items:center;gap:14px;margin:18px 0;padding:16px 18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;color:#475569}
        .tracking-summary strong{font-size:22px;color:#1d4ed8}
        .tracking-tools{margin:18px 0;padding:14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}
        .tracking-search{width:min(100%,560px);height:44px;padding:0 14px;border:1px solid #cbd5e1;border-radius:9px;color:#0f172a;font:inherit}
        .tracking-card{overflow:auto;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
        .tracking-table{width:100%;min-width:1050px;border-collapse:collapse}
        .tracking-table th,.tracking-table td{padding:14px 15px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
        .tracking-table th{background:#f8fafc;color:#64748b;font-size:11px;letter-spacing:.04em}
        .tracking-table td{color:#334155;font-size:13px}
        .tracking-table small{display:block;margin-top:5px;color:#64748b;line-height:1.45}
        .tracking-status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700;white-space:nowrap}
        .tracking-route{display:grid;grid-template-columns:minmax(110px,1fr) 28px minmax(110px,1fr);align-items:center;gap:8px;min-width:260px}
        .tracking-route-arrow{text-align:center;color:#2563eb;font-size:18px}
        .tracking-message{padding:38px 24px!important;text-align:center!important;color:#64748b!important}
        @media(max-width:700px){.tracking-content{padding:18px}.tracking-header{display:block}.tracking-summary{justify-content:space-between}}
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><strong>Cold Chain · Theo dõi lô hàng</strong></div>
                <div class="header-right"><span class="badge badge-neutral">Theo dõi vận chuyển</span></div>
            </header>
            <main class="tracking-content">
                <header class="tracking-header">
                    <div><h1>Lô hàng đang vận chuyển</h1><p>Tra cứu các lô đang được xử lý cùng trạng thái hiện tại, xe phụ trách và lộ trình.</p></div>
                    <button type="button" class="btn btn-secondary" id="tracking-refresh">Làm mới</button>
                </header>
                <section class="tracking-summary" aria-live="polite"><span>Đang vận chuyển</span><strong id="tracking-count">—</strong><span id="tracking-updated">Đang tải…</span></section>
                <section class="tracking-tools"><input class="tracking-search" id="tracking-search" type="search" placeholder="Tìm theo mã lô, sản phẩm, biển số xe hoặc lộ trình…" aria-label="Tìm lô hàng"></section>
                <section class="tracking-card">
                    <table class="tracking-table">
                        <thead><tr><th>MÃ LÔ / SẢN PHẨM</th><th>SỐ LƯỢNG</th><th>TRẠNG THÁI</th><th>XE</th><th>LỘ TRÌNH</th></tr></thead>
                        <tbody id="tracking-body"><tr><td class="tracking-message" colspan="5">Đang tải lô hàng…</td></tr></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
    <script src="../js/i18n.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/roles.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/tracking.js"></script>
</body>
</html>
