<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lô nông sản | Cold Chain</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/app-enhanced.css">
    <style>
        .batch-page { width:100%; max-width:1600px; margin:0 auto; padding:28px; }
        .batch-header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; }
        .batch-header h1 { margin:0 0 6px; font-size:26px; color:#0f172a; }
        .batch-header p { margin:0; color:#64748b; }
        .batch-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
        .batch-toolbar select,.batch-toolbar input { border:1px solid #cbd5e1; border-radius:8px; padding:9px 12px; background:#fff; }
        .batch-table-wrap { overflow:auto; background:#fff; border:1px solid #e2e8f0; border-radius:12px; }
        .batch-table { width:100%; border-collapse:collapse; min-width:1100px; }
        .batch-table th,.batch-table td { padding:13px 14px; text-align:left; border-bottom:1px solid #e2e8f0; vertical-align:top; }
        .batch-table th { background:#f8fafc; color:#475569; font-size:11px; letter-spacing:.04em; }
        .batch-table td { color:#334155; font-size:13px; }
        .batch-table small { display:block; color:#64748b; margin-top:4px; line-height:1.45; }
        .batch-status { display:inline-block; background:#eff6ff; color:#1d4ed8; padding:4px 8px; border-radius:999px; white-space:nowrap; font-size:11px; font-weight:700; }
        .batch-action { border:0; border-radius:7px; background:#1d4ed8; color:#fff; padding:8px 10px; cursor:pointer; font-weight:600; }
        .batch-action:disabled { opacity:.45; cursor:not-allowed; }
        .batch-message { padding:28px; text-align:center; color:#64748b; }
        .batch-counts { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
        .batch-count { border:1px solid #e2e8f0; background:#fff; border-radius:10px; padding:12px 16px; color:#475569; }
        .batch-count strong { display:block; font-size:20px; color:#0f172a; margin-top:4px; }
        @media(max-width:700px){.batch-page{padding:18px}.batch-header{display:block}.batch-toolbar{align-items:stretch;flex-direction:column}}
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"></aside>
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><strong>Cold Chain · Quản lý lô hàng</strong></div>
                <div class="header-right"><span class="badge badge-neutral">Agri-Audit integration</span></div>
            </header>
            <main class="batch-page">
                <header class="batch-header">
                    <div><h1>Lô nông sản từ Agri Audit</h1><p>Theo dõi lấy hàng, chuyển đến kiểm định và giao hoặc hoàn trả theo kết quả.</p></div>
                </header>
                <section class="batch-counts" id="batch-counts" aria-live="polite"></section>
                <section class="batch-toolbar">
                    <select id="batch-status-filter" aria-label="Lọc trạng thái"><option value="ALL">Tất cả trạng thái</option></select>
                    <input id="batch-search" type="search" placeholder="Tìm mã lô, sản phẩm, nông dân..." aria-label="Tìm lô hàng">
                    <button class="btn btn-secondary" id="batch-refresh">Làm mới</button>
                </section>
                <section class="batch-table-wrap">
                    <table class="batch-table">
                        <thead><tr><th>MÃ LÔ / SẢN PHẨM</th><th>NÔNG DÂN</th><th>ĐIỂM LẤY</th><th>ĐÍCH ĐẾN</th><th>SỐ LƯỢNG</th><th>KIỂM ĐỊNH</th><th>VẬN CHUYỂN</th><th>XE / THAO TÁC</th></tr></thead>
                        <tbody id="batch-table-body"><tr><td class="batch-message" colspan="8">Đang tải dữ liệu từ PostgreSQL...</td></tr></tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/roles.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app-enhanced.js"></script>
    <script src="../js/agri-batches.js"></script>
</body>
</html>
