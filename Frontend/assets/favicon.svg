<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Telemetry Wave Circles -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45"/>
  
  <!-- Modern Geometric Snowflake -->
  <g stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Axes -->
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="14.68" y1="22" x2="49.32" y2="42"/>
    <line x1="14.68" y1="42" x2="49.32" y2="22"/>
    
    <!-- Chevrons / Branches -->
    <!-- Top Branch -->
    <polyline points="26,19 32,15 38,19" fill="none"/>
    <!-- Bottom Branch -->
    <polyline points="26,45 32,49 38,45" fill="none"/>
    <!-- Top-Left Branch -->
    <polyline points="18,29 20,24 26,24" fill="none"/>
    <!-- Bottom-Right Branch -->
    <polyline points="46,35 44,40 38,40" fill="none"/>
    <!-- Bottom-Left Branch -->
    <polyline points="18,35 20,40 26,40" fill="none"/>
    <!-- Top-Right Branch -->
    <polyline points="46,29 44,24 38,24" fill="none"/>
  </g>
  
  <!-- Center Core Sensor Node Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="1.5" fill="#0284c7"/>
</svg>
